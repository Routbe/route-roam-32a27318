# Fixed, imported linear memory: the host creates WebAssembly.Memory with
# initial == maximum for every operation and zero-fills it afterwards.
# 32 pages (2 MiB) minimum for server operations, 1088 pages (68 MiB) maximum
# for the Argon2id client operations. No allocator is linked, so the module
# contains no memory.grow instruction (checked by opaque-wasm.test.ts).
[target.wasm32-unknown-unknown]
rustflags = [
  "-C", "link-arg=--import-memory",
  "-C", "link-arg=--initial-memory=2097152",
  "-C", "link-arg=--max-memory=71303168",
  "-C", "link-arg=-zstack-size=1048576",
]
